services:
    api:
        build: ./app
        image: exchange-img:latest
        environment:
            - REDIS_URL=redis://redis:6379
        depends_on:
            redis:
                condition: service_healthy
        deploy:
            replicas: 3

    nginx:
        container_name: exchange-nginx
        image: nginx:1.29.8
        ports:
            - "5555:80"
        volumes:
            - ./nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro
            - ./store/static/files:/static:ro
        links:
            - api

    graphite:
        container_name: exchange-graphite
        image: graphiteapp/graphite-statsd:1.1.10-5
        volumes:
            - ./statsd.config.json:/opt/statsd/config/udp.js
            - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        ports:
            - "8090:80"
            - "8125:8125/udp"
            - "8126:8126"

    grafana:
        container_name: exchange-grafana
        image: grafana/grafana:11.5.10
        ports:
            - "80:3000"
        volumes:
            - "grafana_config:/var/lib/grafana"

    redis:
        container_name: exchange-redis
        build: ./redis
        image: exchange-redis:custom
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

    cadvisor:
        container_name: exchange-cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.51.0
        links:
            - graphite
        command: -storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true
        ports:
            - "8080:8080"
        volumes:
            - "/:/rootfs:ro"
            - "/var/run:/var/run:rw"
            - "/sys:/sys:ro"
            - "/var/lib/docker/:/var/lib/docker:ro"

volumes:
    grafana_config:
        driver: local
    redis_data:
        driver: local
